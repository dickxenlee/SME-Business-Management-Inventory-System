{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Request error{% endblock %} | SME Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <main class="container d-flex min-vh-100 align-items-center justify-content-center py-4">
        <section class="bg-white border rounded-3 p-4 shadow-sm w-100" style="max-width: 42rem;">
            <p class="text-uppercase text-danger small fw-semibold mb-2">{% block code %}Request error{% endblock %}</p>
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
