{% extends "base.html" %}

{% block title %}Check your email | SME Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <p class="report-eyebrow mb-2">ACCOUNT RECOVERY</p>
                <h1 class="h3 mb-3">Check your email</h1>
                <p class="text-secondary">If an account exists for that address, a reset link is on its way. The link expires after a short time, so use it soon.</p>
                <a class="btn btn-primary" href="{% url 'core:login' %}">Back to sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
