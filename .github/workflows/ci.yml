name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sme_manager_ci
          POSTGRES_USER: sme_manager_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sme_manager_ci -d sme_manager_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENVIRONMENT: test
      DJANGO_SECRET_KEY: ci-only-test-signing-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: sme_manager_ci
      DB_USER: sme_manager_ci
      DB_PASSWORD: ci-only-postgres-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_CONNECT_TIMEOUT: "5"
      DB_CONN_MAX_AGE: "0"
      INVOICE_SELLER_NAME: CI Example Business
      INVOICE_SELLER_ADDRESS: CI Example Address
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Check committed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git show --check --format= HEAD
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - name: Run Django checks
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check
      - name: Apply migrations
        run: python manage.py migrate
      - name: Run test suite
        run: python manage.py test

  production-validation:
    runs-on: ubuntu-latest
    needs: test
    env:
      DJANGO_ENVIRONMENT: production
      DJANGO_SECRET_KEY: ci-only-9f8e7d6c5b4a3210-production-validation-secret-value
      DJANGO_ALLOWED_HOSTS: ci.example.invalid
      DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.invalid
      DJANGO_TRUST_PROXY_SSL_HEADER: "False"
      DJANGO_SECURE_HSTS_SECONDS: "3600"
      DJANGO_LOG_LEVEL: INFO
      DB_NAME: ci_production_validation
      DB_USER: ci_production_validation
      DB_PASSWORD: ci-only-production-validation-password
      DB_HOST: database.example.invalid
      DB_PORT: "5432"
      DB_SSLMODE: require
      DB_CONNECT_TIMEOUT: "5"
      DB_CONN_MAX_AGE: "60"
      INVOICE_SELLER_NAME: CI Example Business
      INVOICE_SELLER_ADDRESS: CI Example Address
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Django deployment checks
        run: python manage.py check --deploy
      - name: Collect production static files
        run: python manage.py collectstatic --noinput
      - name: Validate Gunicorn configuration
        run: >-
          gunicorn --check-config
          --bind 0.0.0.0:8000
          --workers 2
          --timeout 60
          --access-logfile -
          --error-logfile -
          --access-logformat '%(h)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s %(L)s'
          sme_manager.wsgi:application
